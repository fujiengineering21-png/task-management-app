spring.application.name=TaskBoard

# データベースの接続情報は、リポジトリ直下の .env から読む（見本は .env.example）
# backend/ から起動しても、リポジトリ直下から起動しても見つかるように、場所を2つ書く
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# 接続先は Docker の PostgreSQL（compose.yaml）。値に初期値を書かないのは、別のデータベースへ誤ってつながないため
# 公開先では、環境変数 SPRING_DATASOURCE_URL・SPRING_DATASOURCE_USERNAME・SPRING_DATASOURCE_PASSWORD が優先される
spring.datasource.url=jdbc:postgresql://127.0.0.1:${TASKBOARD_DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# テーブルは Flyway（db/migration の SQL）が作る。JPA は形が合っているかを確かめるだけ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
